[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "watson"
dynamic = ["version"]
description = "Passive health check for a school's public website: broken links, stale content, and security headers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Watson contributors" }]
keywords = ["school", "website", "links", "security", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]
dependencies = [
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12",
    "openpyxl>=3.1",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
watson = "watson.cli:main"

[project.urls]
Homepage = "https://github.com/JeffStone69/Watson"
Repository = "https://github.com/JeffStone69/Watson"
Issues = "https://github.com/JeffStone69/Watson/issues"

[tool.setuptools.dynamic]
version = { attr = "watson.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
watson = [
    "data/*.json",
    "data/fixture/*",
    "data/fixture/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
